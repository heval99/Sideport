name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits (a moved tag can't change what runs here).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version guard compares with the previous commit / the PR's base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Version only goes up
        # Passed through env, not pasted into the script, so no ref name can ever be run as shell code.
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node .github/scripts/version-guard.mjs "$BASE_REF"
